version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install
      - npm run build
run:
  command: npm start
  network:
    port: 8080
  env:
    - name: CLOUD_PROVIDER
      value: aws
    - name: AWS_REGION
      value: us-east-1
    - name: S3_BUCKET_NAME
      value: rescene-images
    - name: BEDROCK_NOVA_MODEL
      value: us.amazon.nova-pro-v1:0
    - name: BEDROCK_TITAN_IMAGE_MODEL
      value: amazon.titan-image-generator-v2:0
    - name: PORT
      value: "8080"
    - name: USE_MOCK_AI
      value: "false"
